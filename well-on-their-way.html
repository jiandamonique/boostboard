<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EDF2F2">
<meta name="description" content="Fundraising campaigns on Boost Board that have found real support — ten or more donors, with strong progress toward their goal.">
<link rel="canonical" href="https://jiandamonique.github.io/boostboard/well-on-their-way.html">
<meta property="og:title" content="Well on their way — Boost Board">
<meta property="og:description" content="Fundraising campaigns on Boost Board that have found real support — ten or more donors, with strong progress toward their goal.">
<meta property="og:image" content="https://jiandamonique.github.io/boostboard/standin-image.jpg">
<meta property="og:url" content="https://jiandamonique.github.io/boostboard/well-on-their-way.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Boost Board">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>Well on their way — Boost Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./design.css">
<script src="./nav.js" defer></script>
<script src="./footer.js" defer></script>
<style>
.page-intro { padding: 52px 0 36px; max-width: 600px; }
.page-intro .eyebrow { margin-bottom: 12px; }
.page-intro h1 { font-size: clamp(36px, 4vw, 52px); letter-spacing: -2px; line-height: 1.13; margin-bottom: 18px; }
.page-intro p { font-size: 19px; line-height: 1.6; color: var(--body); }
.campaign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; padding-bottom: 64px; }
.campaign-card { background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
.campaign-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
.card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; flex: 1; gap: 10px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.card-body h2 { font-size: 17px; line-height: 1.3; margin: 0; }
.card-body p { font-size: 15px; color: var(--muted); margin: 0; flex: 1; }
.card-actions { margin-top: auto; padding-top: 4px; }
.pct-tag { display: inline-block; background: #dfeae6; color: #2a5e47; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 3px; }
.cat-tag { display: inline-block; background: var(--surface); color: var(--muted); font-size: 13px; padding: 3px 9px; border-radius: 3px; }
.empty-state { padding: 60px 0; text-align: center; color: var(--muted); }
.empty-state p { font-size: 17px; margin-top: 10px; }
@media (max-width: 900px) { .campaign-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) {
  .page-intro { padding: 36px 0 24px; }
  .campaign-grid { grid-template-columns: 1fr; gap: 20px; padding-bottom: 44px; }
}
</style>
</head>
<body>
<main id="main">
<div class="wrap">

<section class="page-intro" aria-labelledby="page-title">
  <div class="eyebrow">Boost Board</div>
  <h1 id="page-title">Well on their way</h1>
  <p>These campaigns have found real support — ten or more donors, with strong progress toward their goal. They've moved off the active board, but sharing them still matters.</p>
</section>

<div id="campaignGrid" class="campaign-grid" aria-live="polite">
  <p style="color:var(--muted);font-size:16px;">Loading campaigns…</p>
</div>

</div>
</main>

<script src="./board-data.js"></script>
<script>
(function () {
  const grid = document.getElementById('campaignGrid');

  const qualifying = campaigns.filter(c =>
    !c.reported && qualifiesAsWellOnWay(c)
  );

  if (qualifying.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <p>No campaigns are in this category right now.</p>
        <p style="margin-top:8px;"><a class="text-link" href="./board.html">See all campaigns on the board</a></p>
      </div>
    `;
    return;
  }

  // Sort by percentage of goal, highest first — most momentum at the top.
  qualifying.sort((a, b) => {
    const pa = percentOfGoal(a) ?? 0;
    const pb = percentOfGoal(b) ?? 0;
    return pb - pa;
  });

  grid.innerHTML = qualifying.map(c => {
    const pct = percentOfGoal(c);
    const pctLabel = pct !== null ? `${Math.round(pct)}% of goal` : '10+ donors';
    const catTag = (c.category || []).slice(0, 1)
      .map(cat => `<span class="cat-tag">${cat}</span>`).join('');
    return `
      <article class="campaign-card">
        <a href="${c.link}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
          <img src="${c.imageUrl || './standin-image.jpg'}" alt=""
               onerror="this.src='./standin-image.jpg'" loading="lazy">
        </a>
        <div class="card-body">
          <div class="card-tags">
            <span class="pct-tag">${pctLabel}</span>
            ${catTag}
          </div>
          <h2><a href="${c.link}" target="_blank" rel="noopener">${c.name}</a></h2>
          <p>${c.description}</p>
          <div class="card-actions">
            <a class="text-link" href="${c.link}" target="_blank" rel="noopener">
              View campaign
              <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
            </a>
          </div>
        </div>
      </article>
    `;
  }).join('');
})();
</script>
</body>
</html>
