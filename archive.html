<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EDF2F2">
<meta name="description" content="Every campaign that's graduated off the active Boost Board -- an automatic, uncurated record.">
<link rel="canonical" href="https://jiandamonique.github.io/boostboard/archive.html">
<meta property="og:title" content="General Archive — Boost Board">
<meta property="og:description" content="Every campaign that's graduated off the active Boost Board -- an automatic, uncurated record.">
<meta property="og:image" content="https://jiandamonique.github.io/boostboard/standin-image.jpg">
<meta property="og:url" content="https://jiandamonique.github.io/boostboard/archive.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Boost Board">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>General Archive — Boost Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./design.css">
<script src="./nav.js" defer></script>
<script src="./footer.js" defer></script>
<style>
.intro{max-width:620px;margin:0 auto;padding:52px 0 30px;text-align:center}
h1{font-size:clamp(32px,4vw,42px);letter-spacing:-1.8px}
.intro p{font-size:18px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;padding-bottom:60px}
.empty{max-width:440px;margin:20px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:40px;font-family:var(--heading);font-style:italic;color:var(--muted)}
</style>
</head>
<body>
<main id="main" class="wrap">
<div class="intro">
  <h1>General Archive</h1>
  <p>A plain, automatic record — every campaign that's passed 10 donors and graduated off the active board. This list updates itself and isn't curated. For hand-picked stories with more detail, see <a class="text-link" href="./success-stories.html" style="display:inline;">Success Stories</a>.</p>
</div>
<div class="grid" id="archiveGrid"></div>
</main>

<script src="./board-data.js"></script>
<script src="./random-campaign-widget.js"></script>
<script>
  const graduated = campaigns.filter(c => tierOf(c) === 'graduated' && !qualifiesAsFallback(c) && !c.reported);
  const grid = document.getElementById('archiveGrid');
  if (graduated.length === 0) {
    grid.innerHTML = `<p class="empty">No graduated campaigns yet — the first one will show up here.</p>`;
  } else {
    grid.innerHTML = graduated.map(c => `
      <div class="card"><div class="card-body">
        <div class="eyebrow">Graduated · ${c.donationCount}+ donors</div>
        <h3>${c.name}</h3>
        <p>${c.description}</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${(c.communities||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div></div>
    `).join('');
  }
</script>
</body>
</html>
