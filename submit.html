<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Your Page — Boost Board</title>
<meta name="description" content="Submit your fundraising campaign to be reviewed and featured on Boost Board.">
<link rel="canonical" href="https://jiandamonique.github.io/boostboard/submit.html">
<meta property="og:title" content="Share Your Page — Boost Board">
<meta property="og:description" content="Submit your fundraising campaign to be reviewed and featured on Boost Board.">
<meta property="og:image" content="https://jiandamonique.github.io/boostboard/standin-image.jpg">
<meta property="og:url" content="https://jiandamonique.github.io/boostboard/submit.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Boost Board">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="./nav.js" defer></script>
<script src="./footer.js" defer></script>
<script src="./board-data.js" defer></script>
<script src="./random-campaign-widget.js" defer></script>
<style>
  :root { --cream: #f2f7f2; --warm: #e6efe6; --deep: #162418; --muted: #5c6b5c; --border: rgba(40,80,45,0.18); --shadow: 0 4px 24px rgba(22,36,24,0.08); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--deep); font-family: 'Source Sans 3', sans-serif; padding: 2.5rem 1.5rem; line-height: 1.6; }
  .wrap { max-width: 620px; margin: 0 auto; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.6rem; text-align: center; }
  h1 { font-family: 'Lora', serif; font-size: 1.6rem; margin-bottom: 0.6rem; text-align: center; }
  p.sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 2rem; text-align: center; }
  .form-panel { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 1rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
  .form-panel iframe { width: 100%; height: 900px; border: none; border-radius: 8px; }
  .placeholder-note { background: var(--warm); border-radius: 10px; padding: 1rem 1.2rem; font-size: 0.85rem; color: var(--deep); text-align: center; }
  .fallback { max-width: 500px; margin: 0 auto; text-align: center; font-size: 0.88rem; color: var(--muted); }
  .fallback a { color: var(--deep); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Submit your campaign</div>
  <h1>Share Your Page</h1>
  <p class="sub">Tell us about your fundraiser — every submission is reviewed by a real person
  before it's featured. No pressure, no guarantee, just a chance to be seen.</p>

  <div class="form-panel">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf9ThdOcUj8fxX8VaZcT_aer0f53cIrZy3NVNv-ZwwKumJi9A/viewform?embedded=true" width="100%" height="1000" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
  </div>

  <p class="fallback">You can also reach out directly through the
  <a href="./credits.html">Credits & Support</a> page or as a
  <a href="https://github.com/jiandamonique/boostboard/issues" target="_blank" rel="noopener">GitHub issue</a>
  in the meantime.</p>
</div>
</body>
</html>
