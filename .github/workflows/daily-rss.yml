name: Daily RSS regeneration

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily, adjust as needed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node generate-rss.js
      - name: Commit updated rss.xml
        run: |
          git config user.name "rss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rss.xml
          git diff --cached --quiet || git commit -m "Regenerate daily RSS feed"
          git push
