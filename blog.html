<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EDF2F2">
<meta name="description" content="Updates and writing from the Boost Board team.">
<link rel="canonical" href="https://jiandamonique.github.io/boostboard/blog.html">
<meta property="og:title" content="Blog — Boost Board">
<meta property="og:description" content="Updates and writing from the Boost Board team.">
<meta property="og:image" content="https://jiandamonique.github.io/boostboard/standin-image.jpg">
<meta property="og:url" content="https://jiandamonique.github.io/boostboard/blog.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Boost Board">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>Blog — Boost Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./design.css">
<script src="./nav.js" defer></script>
<script src="./footer.js" defer></script>
<script src="./board-data.js" defer></script>
<script src="./random-campaign-widget.js" defer></script>
<style>
.intro{padding:50px 0 30px;text-align:center;max-width:600px;margin:0 auto}
h1{font-size:clamp(36px,4.2vw,50px);letter-spacing:-2.2px}
.intro p{font-size:19px;margin-top:14px}
.posts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;padding-bottom:60px}
.post-card{background:#fff;border:1px solid var(--line);border-radius:5px;padding:24px;display:flex;flex-direction:column;gap:10px}
.post-card .post-date{font-family:var(--heading);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.post-card h2{font-size:20px;letter-spacing:-.4px;line-height:1.3}
.post-card h2 a{color:var(--ink)}
.post-card p{font-size:15px}
.post-card .text-link{margin-top:auto;align-self:flex-start;font-size:14px}
.empty-state{max-width:480px;margin:0 auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:40px}
@media(max-width:740px){.posts-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="main" class="wrap">
<div class="intro">
  <h1>Blog</h1>
  <p>Updates and writing from the Boost Board team.</p>
</div>
<div class="posts-grid" id="postsGrid"></div>
</main>

<script>
  const posts = [
    { title: "Why Boost Board Exists", filename: "why-boost-board-exists.html", date: "2026-09-07", excerpt: "The three things that led to building this — algorithms, predatory services, and an old radio story about a fake crowd." },
    { title: "How Fundraisers Actually Get Found", filename: "how-fundraisers-get-found.html", date: "2026-09-07", excerpt: "Search, location filters, social sharing, privacy settings — and why every one of them favors a campaign that already has momentum." },
    { title: "Sharing Helps More Than You'd Think", filename: "sharing-does-more-than-you-think.html", date: "2026-09-07", excerpt: "Real numbers on how much a single share is worth — for campaigns you can't afford to donate to." },
    { title: "Amplify the Campaigns Still Waiting for Their First Yes", filename: "amplify-the-campaigns-still-waiting.html", date: "2026-09-07", excerpt: "Why we're raising a small, transparent amount to keep Boost Board running — and why that's an amplifier of GoFundMe, not a criticism of it." },
    { title: "Labor Day Launch: Boost Board Gives Daily Visibility to Fundraising Campaigns Stuck at Zero", filename: "labor-day-launch-press-release.html", date: "2026-09-07", excerpt: "Press release." },
    { title: "We Built This Waiting for a First Yes. Now We're Waiting Too.", filename: "waiting-for-a-first-yes-too.html", date: "2026-09-07", excerpt: "Boost Board's own fundraiser is sitting at zero donations — the exact situation it exists to help with. Some honest thoughts on that." },
    { title: "A Note for Donors: Why the Loudest Campaign Isn't the One That Needs You Most", filename: "a-note-for-donors.html", date: "2026-09-07", excerpt: "Research shows crowdfunding success tracks social media savvy more than actual need. Some honest thoughts on where that leaves you, and how to give well anyway." },
  ];

  const grid = document.getElementById('postsGrid');
  if (posts.length === 0) {
    grid.innerHTML = `<div class="empty-state"><p>Nothing posted yet — check back soon.</p></div>`;
  } else {
    grid.innerHTML = posts.slice().reverse().map(p => `
      <div class="post-card">
        <div class="post-date">${p.date}</div>
        <h2><a href="./${p.filename}">${p.title}</a></h2>
        <p>${p.excerpt}</p>
        <a class="text-link" href="./${p.filename}">Read more <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px;"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
      </div>
    `).join('');
  }
</script>
</body>
</html>
