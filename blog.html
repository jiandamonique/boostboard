<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Boost Board</title>
<meta name="description" content="Updates and writing from the Boost Board team.">
<link rel="canonical" href="https://jiandamonique.github.io/boostboard/blog.html">
<meta property="og:title" content="Blog — Boost Board">
<meta property="og:description" content="Updates and writing from the Boost Board team.">
<meta property="og:image" content="https://jiandamonique.github.io/boostboard/standin-image.jpg">
<meta property="og:url" content="https://jiandamonique.github.io/boostboard/blog.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Boost Board">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="./nav.js" defer></script>
<script src="./footer.js" defer></script>
<script src="./board-data.js" defer></script>
<script src="./random-campaign-widget.js" defer></script>
<style>
  :root { --cream: #f2f7f2; --warm: #e6efe6; --deep: #162418; --muted: #5c6b5c; --border: rgba(40,80,45,0.18); --shadow: 0 4px 24px rgba(22,36,24,0.08); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--deep); font-family: 'Source Sans 3', sans-serif; padding: 2.5rem 1.5rem; }
  .wrap { max-width: 620px; margin: 0 auto; }
  h1 { font-family: 'Lora', serif; font-size: 1.6rem; margin-bottom: 0.4rem; text-align: center; }
  p.sub { color: var(--muted); font-size: 0.9rem; text-align: center; margin-bottom: 2rem; }
  .post { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.1rem; }
  .post h2 { font-family: 'Lora', serif; font-size: 1.15rem; margin-bottom: 0.4rem; }
  .post h2 a { color: var(--deep); text-decoration: none; }
  .post p { color: var(--muted); font-size: 0.88rem; }
  .post .date { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  .empty-state { max-width: 480px; margin: 2rem auto; text-align: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 2rem; box-shadow: var(--shadow); }
  .empty-state p { font-family: 'Lora', serif; font-style: italic; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Blog</h1>
  <p class="sub">Written with our internal composer tool — no code needed to write a post.</p>
  <div id="postsList"></div>
</div>

<script>
  // Add one entry per post here after generating it with blog-composer.html
  // and uploading the resulting file. No limit on count.
  const posts = [
    { title: "Why Boost Board Exists", filename: "why-boost-board-exists.html", date: "2026-09-07", excerpt: "The three things that led to building this — algorithms, predatory services, and an old radio story about a fake crowd." },
    { title: "How Fundraisers Actually Get Found", filename: "how-fundraisers-get-found.html", date: "2026-09-07", excerpt: "Search, location filters, social sharing, privacy settings — and why every one of them favors a campaign that already has momentum." },
    { title: "Sharing Does More Than You Think", filename: "sharing-does-more-than-you-think.html", date: "2026-09-07", excerpt: "Real numbers on how much a single share is actually worth — for campaigns you can't afford to donate to." },
  ];

  const container = document.getElementById('postsList');
  if (posts.length === 0) {
    container.innerHTML = `<div class="empty-state"><p>Nothing posted yet — check back soon.</p></div>`;
  } else {
    posts.slice().reverse().forEach(p => {
      const div = document.createElement('div');
      div.className = 'post';
      div.innerHTML = `
        <div class="date">${p.date}</div>
        <h2><a href="./${p.filename}">${p.title}</a></h2>
        <p>${p.excerpt}</p>
      `;
      container.appendChild(div);
    });
  }
</script>
</body>
</html>
